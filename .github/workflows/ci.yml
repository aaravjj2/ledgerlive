name: CI
on:
  push:
    branches: [main, waves]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd apps/api && python -m pytest tests/ -q --tb=short --junitxml=../../junit-backend.xml
        env:
          APP_MODE: DEMO
          E2E_MODE: '1'
          LLM_PROVIDER: DEMO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: junit-backend.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install black isort ruff bandit
      - run: black --check apps/api/
      - run: isort --check-only apps/api/
      - run: cd apps/web && npm ci && npx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install bandit pip-audit
      - run: bandit -r apps/api/app/ -ll --skip B101 || true
      - run: pip-audit -r requirements.txt || true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci && npm run build
